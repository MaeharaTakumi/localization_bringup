# localization_bringup の環境 gazebo（ros2 launch localization_bringup localization.launch.py env:=gazebo）
# このフォルダの <ノード名>.yaml を launch がそのノードに渡す。yaml が無いノード、yaml に書いていない項目は、
# そのノードのコードの既定値になる（どの項目も書いておく。2026-11-11、dev_log.md の 84）。
# Gazebo（sim time。取付は URDF。オドメトリは Gazebo の /wheelchair/odom）
#
# env.yaml は launch が読む（ROS のパラメータファイルではない）。書いていない項目は、use_sim_time: false、static_tfs: なし、
# nodes: pcl_localization と ekf_localizer だけ true（env を指定しないときと同じ）。

use_sim_time: true

# 起動するノード。launch 引数 use_ekf:=（ekf_localizer）・rviz:= を付けるとそちらが優先
# トピックは各ノードの名前のまま（/velodyne_points・/ndt_pose・/wheelchair/odom・/initialpose・/ekf_pose・/ekf_odom・/initial_map）で
# つながる。launch が付け替えるのは ekf_localizer の odom（→ /wheelchair/odom）と NDT の pcl_pose（→ /current_pose）だけ
nodes:
  whill_odometry: false   # オドメトリは Gazebo（gazebo_bridge）が /wheelchair/odom に配信する
  pcl_localization: true    # NDT
  ekf_localizer: true       # EKF
  rviz: true                # RViz（pcl_localization_ros2 の rviz/localization2.rviz）

# 取付は Gazebo の URDF（robot_state_publisher）が配信する base_footprint -> base_link -> velodyne_base_link -> velodyne を使う。
# ここで同じ子フレームを配信すると velodyne の親が 2 つになり、ノードごとに違う取付を読むことがあるので、何も配信しない
static_tfs: []
