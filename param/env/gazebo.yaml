# Gazebo の環境設定。ros2 launch localization_bringup localization.launch.py env:=gazebo
# このファイルは launch が読む（ROS のパラメータファイルではない）。項目の説明は real.yaml

use_sim_time: true

topics:
  points: /velodyne_points        # gazebo_ros_laser_controller（sim time）
  odom: /wheelchair/odom          # gazebo_bridge（50 Hz、best effort）

# オドメトリは Gazebo（gazebo_bridge）が配信するので whill_odometry は起動しない
launch_odometry: false

# URDF に base_footprint -> base_link（静的）があるので、map -> base_footprint を配信する
base_frame_id: base_footprint
lidar_frame_id: velodyne

# sim time で stamp が揃っているので直さない
cloud_stamp_correction: none

# 取付は Gazebo の URDF（robot_state_publisher）が配信する base_footprint -> base_link -> velodyne_base_link
# -> velodyne を使う（estimator によらない）。ここで同じ子フレームを配信すると velodyne の親が 2 つになり、
# 取付として使われる値が到着順で変わる（ノードごとに違う値を読むこともある）ので、何も配信しない
static_tfs: []

parameters:
  pcl_localization:
    map_path: /root/ros2_ws/map/SC10_4_0.05.pcd
    # 初期姿勢（LiDAR の姿勢）。Gazebo の出現位置 /wheelchair/pose（base_footprint）
    # (80.037, 7.072, 12.332), yaw 3.110 rad に取付 base_footprint -> velodyne を合成した値
    set_initial_pose: true
    initial_pose_x: 80.207
    initial_pose_y: 7.067
    initial_pose_z: 13.470
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.999872
    initial_pose_qw: 0.015974
  ekf_localizer:
    # diff_drive_controller の twist は 10 サンプル（50 Hz で 0.2 s）の移動平均なので、実際の動きより
    # 約 0.09 s 遅れる（真値 /wheelchair/pose との比較で v・omega とも 0.09〜0.10 s）
    odom_delay: 0.00
    # 遅れを補正しているので、yaw はオドメトリで予測できる。
    # Q を小さくして NDT の揺れ（走行中の yaw・z・roll・pitch）を抑える。
    # Gazebo の床は水平で真の z・roll・pitch は一定。x, y は LiDAR の高さ 1.14 m のレバーアームで
    # roll・pitch と結合しているので、小さくしすぎると NDT の位置の揺れが roll・pitch に回る
    # Q: [1.0e-2, 1.0e-2, 1.0e-3, 2.0e-3, 2.0e-3, 1.0e-3, 0.05, 1.0]
  # ---- robot_localization（estimator:=robot_localization）----
  # 左右 1 周 + 前進（1 rad/s、1.5 m/s）の録画を再生して調整した値（tools の tune_run.py）。
  # 15x15 の行列は <名前>_diag に対角 15 個で書く（launch が行列に直す）
  # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
  ekf_filter_node_odom:
    # map 側は map -> odom を出すとき、現在時刻の odom -> base を TF から引く。引けないと robot_localization は
    # 黙って最新の TF で代用するので、odom 側が古い（50 Hz だと最大 20 ms）分だけ回転中に yaw がずれる。
    # odom 側を速くして TF が古い時間を短くする
    frequency: 200.0
    # vyaw を大きく：回転の切り替え（+1 -> -1 rad/s）に omega が早く追従する
    process_noise_covariance_diag: [0.05, 0.05, 0.005, 0.05, 0.05, 0.05, 0.05, 0.025, 0.04, 0.01, 0.01, 1.0, 0.01, 0.01, 0.015]
  ekf_filter_node_map:
    # odom -> base を最大 0.05 s 待つ（来なければ最新で代用）
    transform_timeout: 0.05
    process_noise_covariance_diag: [0.05, 0.05, 0.005, 0.05, 0.05, 0.05, 0.05, 0.025, 0.04, 0.01, 0.01, 1.0, 0.01, 0.01, 0.015]
