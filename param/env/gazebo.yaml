# Gazebo の環境設定。ros2 launch localization_bringup localization.launch.py env:=gazebo
# このファイルは launch が読む（ROS のパラメータファイルではない）。項目の説明は red.yaml

use_sim_time: true

# 起動するノード（enable）と、各ノードが購読・配信するトピック（topics。ノードの中の名前: 実際の名前）。
# launch は topics をそのまま remap に渡すので、つなぐときは配信側と購読側を同じ名前にする。/tf・/tf_static・/clock は変えない。
# 止めたノードの出力は、録画や別の PC から来るものとして扱う（つなぎ方は変わらない）。
# launch 引数 use_ekf:=（ekf_localizer と odom_covariance）・rviz:= を付けると、enable よりそちらが優先
nodes:
  # オドメトリは Gazebo（gazebo_bridge）が配信するので起動しない
  whill_odometry:
    enable: false
  # 車輪の角速度（/wheelchair/joint_states）からのオドメトリ（試す用。実運用では使わない）。使うときは enable: true にし、
  # odom_covariance の odom も同じ名前にする。パラメータは parameters.joint_state_odometry
  # （left_wheel_joint・right_wheel_joint・wheel_radius 0.1325・wheel_separation 0.492）
  joint_state_odometry:
    enable: false
    topics:
      joint_states: /wheelchair/joint_states    # 購読：車輪の角速度
      odom: /localization/wheel_odom            # 配信：オドメトリ
  # 点群の stamp を直す。stamp_mode が receipt・auto のときだけ起動する（enable は書かない）。
  # 起動するときは、ほかのノードで input と同じ名前のトピック（点群）を output に付け替える
  cloud_stamp_corrector:
    topics:
      input: /velodyne_points                   # 購読：点群
      output: /localization/points              # 配信：stamp を直した点群
  # NDT
  pcl_localization:
    enable: true
    topics:
      velodyne_points: /velodyne_points         # 購読：点群（gazebo_ros_laser_controller。sim time）
      initialpose: /initialpose                 # 購読：初期姿勢（LiDAR の姿勢。RViz の 2D Pose Estimate）
      map: /map                                 # 購読：地図（use_pcd_map: false のとき。今は PCD を読むので使わない）
      imu: /imu                                 # 購読：IMU（use_imu: true のとき。今は使わない）
      ndt_pose: /ndt_pose                       # 配信：NDT の解（map → LiDAR、stamp は点群の取得時刻）
      pcl_pose: /current_pose                   # 配信：NDT の解（RViz 用）
      path: /path                               # 配信：NDT の解の軌跡
      initial_map: /initial_map                 # 配信：読み込んだ地図
      localization_debug: /localization_debug   # 配信：[点数, align 時間, 収束, fitness, angle_diff]
      tf_rviz: /tf_rviz                         # 配信：publish_rviz_tf: true のとき（launch は false にする）
  # オドメトリに倍率・観測ノイズ R・時刻を付けて EKF に渡す
  odom_covariance:
    enable: true
    topics:
      # 購読：オドメトリ（gazebo_bridge が中継する diff_drive_controller。Gazebo の controller.yaml を
      # velocity_rolling_window_size: 1 にしたので（2026-10-12）、移動平均なし）
      odom: /wheelchair/odom
      odom_out: /localization/odom              # 配信：倍率・R・時刻を付けたオドメトリ
  # EKF
  ekf_localizer:
    enable: true
    topics:
      ndt_pose: /ndt_pose                       # 購読：NDT の解
      odom: /localization/odom                  # 購読：オドメトリ（odom_covariance）
      velodyne_points: /velodyne_points         # 購読：点群（time_source: receipt のときだけ。受信した時刻を NDT の観測の時刻にする）
      initialpose: /initialpose                 # 購読：初期姿勢（EKF をリセットする）
      ekf_pose: /ekf_pose                       # 配信：推定（map → LiDAR）
      ekf_odom: /ekf_odom                       # 配信：推定（map → base と速度）
      tf_ndt_update: /tf_ndt_update             # 配信：NDT で更新した直後の map → base（launch が RViz の /tf をこれにする）
  # RViz（ノードの中の名前は pcl_localization_ros2 の rviz/localization2.rviz に書いてある名前）
  rviz:
    enable: true
    topics:
      /velodyne_points: /velodyne_points        # 表示：点群
      /current_pose: /current_pose              # 表示：NDT の解
      /initial_map: /initial_map                # 表示：地図
      /ekf/pose: /ekf/pose                      # 表示：EKFPose（配信するノードは無い）
      /initialpose: /initialpose                # 配信：2D Pose Estimate
      /goal_pose: /goal_pose                    # 配信：2D Goal Pose（使っていない）
      /clicked_point: /clicked_point            # 配信：Publish Point（使っていない）

# URDF に base_footprint -> base_link（静的）があるので、map -> base_footprint を配信する
base_frame_id: base_footprint
lidar_frame_id: velodyne

# 点群とオドメトリの時刻：sim time で stamp が揃っているのでそのまま使う（stamp / receipt / auto。red.yaml を参照）
stamp_mode: stamp

# 取付は Gazebo の URDF（robot_state_publisher）が配信する base_footprint -> base_link -> velodyne_base_link
# -> velodyne を使う。ここで同じ子フレームを配信すると velodyne の親が 2 つになり、
# 取付として使われる値が到着順で変わる（ノードごとに違う値を読むこともある）ので、何も配信しない
static_tfs: []

parameters:
  pcl_localization:
    map_path: /root/ros2_ws/map/SC10_4_0.05.pcd
    # 初期姿勢（LiDAR の姿勢）。Gazebo の出現位置 /wheelchair/pose（base_footprint）
    # (80.037, 7.072, 12.332), yaw 3.110 rad に取付 base_footprint -> velodyne を合成した値
    set_initial_pose: true
    initial_pose_x: 80.207
    initial_pose_y: 7.067
    initial_pose_z: 13.470
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.999872
    initial_pose_qw: 0.015974
  # ---- オドメトリ（odom_covariance：ekf_localizer に渡す前に、倍率と観測ノイズ R を付ける）----
  #   R_v     = R_odom[0] + odom_noise_alpha[0]·v² + odom_noise_alpha[1]·ω² + (accel_noise_tau[0]·dv/dt)²
  #   R_omega = R_odom[1] + odom_noise_alpha[2]·v² + odom_noise_alpha[3]·ω² + (accel_noise_tau[1]·dω/dt)²
  #   ekf_localizer は odom_covariance_source: message でこの R を使う（ekf.yaml の R_odom ではない）。
  #   時刻は stamp_mode（launch が odom_covariance の stamp_mode・auto_threshold に入れる）、遅れの補正は ekf_localizer の odom_delay
  odom_covariance:
    R_odom: [2.5e-3, 5.0e-3]                 # 止まっているときの分散 [v, omega]
    odom_noise_alpha: [0.0, 0.0, 0.0, 0.0]   # 速さに応じた分 [v²→R_v, ω²→R_v, v²→R_omega, ω²→R_omega]（試したが効かなかった）
    R_odom_other: 1.0e-6                     # 他の成分（vy, vz, vroll, vpitch）の分散
    accel_noise_tau: [0.0, 0.0]              # 加速度に応じた分 [τ_v, τ_omega] [s]：R に (τ·加速度)²（試したが効かなかった）
    # 回転中、オドメトリの omega は真値の 1.08〜1.09 倍（実効的な車輪間隔が 0.532〜0.535 m で、設定の 0.492 m より広い）。
    # 真値 / オドメトリ（左 0.9205、右 0.9243）の平均を掛けて補正する。diff_drive_controller の
    # wheel_separation_multiplier: 1.085 で同じことを確かめた（Gazebo 側は変えない）。v は真値と一致
    odom_scale: [1.0, 0.922]
  ekf_localizer:
    # TF・/ekf_pose は ekf.yaml の predict_rate（50 Hz）の周期の予測値。2026-10-12〜26 は publish_trigger: update
    # （NDT・オドメトリで更新するたびに、その時刻の事後推定値）だった（dev_log.md の 21・68）
    # R_ndt は ekf.yaml の値のまま（[1e-2, 1e-2, 1e-2, 0.03, 0.03, 1e-3]）。止まった状態で測った小さい R_ndt
    # （noise/ndt_init_noise.py）にすると、NDT が真値の近くの別の解に収束するのに EKF が引っ張られて振動に入りやすく、
    # 調整に使っていない録画の再生で 8 回中 6 回悪化した（2026-10-12、dev_log.md の 17）
    # オドメトリに移動平均がかかっていないので、遅れの補正はしない。
    # （0.2 s の移動平均のときは 0.09 s 戻していた：速度の変化が斜めになり、ずらすと動き出しが真値より早すぎ、
    #   v（車輪が滑って車体より先に変わる）では前進開始・停止が悪くなった）
    odom_delay: 0.0
    # omega の Q を大きく（0.01 -> 10）：速度が急に変わったとき、omega が遅れの補正したオドメトリと NDT に早く追従する。
    # 左右 1 周 + 前進の再生で、回転開始・反転の yaw 誤差の跳ねが約半分（反転 7 -> 4〜4.6 deg）。他は ekf.yaml の値
    Q: [5.0e-2, 5.0e-2, 5.0e-3, 5.0e-2, 5.0e-2, 5.0e-2, 0.05, 10.0]
    # 遅れを補正しているので、yaw はオドメトリで予測できる。
    # Q を小さくして NDT の揺れ（走行中の yaw・z・roll・pitch）を抑える。
    # Gazebo の床は水平で真の z・roll・pitch は一定。x, y は LiDAR の高さ 1.14 m のレバーアームで
    # roll・pitch と結合しているので、小さくしすぎると NDT の位置の揺れが roll・pitch に回る
    # Q: [1.0e-2, 1.0e-2, 1.0e-3, 2.0e-3, 2.0e-3, 1.0e-3, 0.05, 1.0]
