# Gazebo の環境設定。ros2 launch localization_bringup localization.launch.py env:=gazebo
# このファイルは launch が読む（ROS のパラメータファイルではない）。項目の説明は red.yaml

use_sim_time: true

topics:
  points: /velodyne_points        # gazebo_ros_laser_controller（sim time）
  # gazebo_bridge が中継する diff_drive_controller のオドメトリ。Gazebo の controller.yaml を
  # velocity_rolling_window_size: 1 にしたので（2026-10-12）、速度は移動平均なし（直近 0.02 s の車輪の回転角の差）
  odom: /wheelchair/odom

# 車輪の角速度（/wheelchair/joint_states）から計算したオドメトリを使うときは、次を書くと launch が joint_state_odometry を
# 起動して topics.odom に出す（topics.odom を /localization/wheel_odom などにする）。実運用では使わない
# joint_state_odometry:
#   topic: /wheelchair/joint_states
#   left_wheel_joint: left_wheel_joint
#   right_wheel_joint: right_wheel_joint
#   wheel_radius: 0.1325
#   wheel_separation: 0.492

# オドメトリは Gazebo（gazebo_bridge）が配信するので whill_odometry は起動しない
launch_odometry: false

# URDF に base_footprint -> base_link（静的）があるので、map -> base_footprint を配信する
base_frame_id: base_footprint
lidar_frame_id: velodyne

# 点群とオドメトリの時刻：sim time で stamp が揃っているのでそのまま使う（true / false / auto。red.yaml を参照）
clock_synced: true

# 取付は Gazebo の URDF（robot_state_publisher）が配信する base_footprint -> base_link -> velodyne_base_link
# -> velodyne を使う。ここで同じ子フレームを配信すると velodyne の親が 2 つになり、
# 取付として使われる値が到着順で変わる（ノードごとに違う値を読むこともある）ので、何も配信しない
static_tfs: []

parameters:
  pcl_localization:
    map_path: /root/ros2_ws/map/SC10_4_0.05.pcd
    # 初期姿勢（LiDAR の姿勢）。Gazebo の出現位置 /wheelchair/pose（base_footprint）
    # (80.037, 7.072, 12.332), yaw 3.110 rad に取付 base_footprint -> velodyne を合成した値
    set_initial_pose: true
    initial_pose_x: 80.207
    initial_pose_y: 7.067
    initial_pose_z: 13.470
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.999872
    initial_pose_qw: 0.015974
  # ---- オドメトリ（odom_covariance：ekf_localizer に渡す前に、倍率と観測ノイズ R を付ける）----
  #   R_v     = R_odom[0] + odom_noise_alpha[0]·v² + odom_noise_alpha[1]·ω² + (accel_noise_tau[0]·dv/dt)²
  #   R_omega = R_odom[1] + odom_noise_alpha[2]·v² + odom_noise_alpha[3]·ω² + (accel_noise_tau[1]·dω/dt)²
  #   ekf_localizer は odom_covariance_source: message でこの R を使う（ekf.yaml の R_odom ではない）。
  #   時刻は clock_synced（launch が stamp_mode・auto_threshold を入れる）、遅れの補正は ekf_localizer の odom_delay
  odom_covariance:
    R_odom: [2.5e-3, 5.0e-3]                 # 止まっているときの分散 [v, omega]
    odom_noise_alpha: [0.0, 0.0, 0.0, 0.0]   # 速さに応じた分 [v²→R_v, ω²→R_v, v²→R_omega, ω²→R_omega]（試したが効かなかった）
    R_odom_other: 1.0e-6                     # 他の成分（vy, vz, vroll, vpitch）の分散
    accel_noise_tau: [0.0, 0.0]              # 加速度に応じた分 [τ_v, τ_omega] [s]：R に (τ·加速度)²（試したが効かなかった）
    # 回転中、オドメトリの omega は真値の 1.08〜1.09 倍（実効的な車輪間隔が 0.532〜0.535 m で、設定の 0.492 m より広い）。
    # 真値 / オドメトリ（左 0.9205、右 0.9243）の平均を掛けて補正する。diff_drive_controller の
    # wheel_separation_multiplier: 1.085 で同じことを確かめた（Gazebo 側は変えない）。v は真値と一致
    odom_scale: [1.0, 0.922]
  ekf_localizer:
    # NDT・オドメトリで更新するたびに、その観測の時刻の事後推定値を TF・/ekf_pose に出す（2026-10-12、ユーザー指示）。
    # 左右 1 周 + 前進の再生（調整に使っていない録画）で timer（20 Hz）のスコア平均 1.02（0.95〜1.19、4 回）→ 0.96（0.91〜1.02、6 回）。
    # オドメトリの時刻ごとに TF が出るので、NDT が点群の時刻で引く初期値が正確になる
    publish_trigger: update
    # R_ndt は ekf.yaml の値のまま（[1e-2, 1e-2, 1e-2, 0.03, 0.03, 1e-3]）。止まった状態で測った小さい R_ndt
    # （noise/ndt_init_noise.py）にすると、NDT が真値の近くの別の解に収束するのに EKF が引っ張られて振動に入りやすく、
    # 調整に使っていない録画の再生で 8 回中 6 回悪化した（2026-10-12、dev_log.md の 17）
    # オドメトリに移動平均がかかっていないので、遅れの補正はしない。
    # （0.2 s の移動平均のときは 0.09 s 戻していた：速度の変化が斜めになり、ずらすと動き出しが真値より早すぎ、
    #   v（車輪が滑って車体より先に変わる）では前進開始・停止が悪くなった）
    odom_delay: 0.0
    # omega の Q を大きく（0.01 -> 10）：速度が急に変わったとき、omega が遅れの補正したオドメトリと NDT に早く追従する。
    # 左右 1 周 + 前進の再生で、回転開始・反転の yaw 誤差の跳ねが約半分（反転 7 -> 4〜4.6 deg）。他は ekf.yaml の値
    Q: [5.0e-2, 5.0e-2, 5.0e-3, 5.0e-2, 5.0e-2, 5.0e-2, 0.05, 10.0]
    # 遅れを補正しているので、yaw はオドメトリで予測できる。
    # Q を小さくして NDT の揺れ（走行中の yaw・z・roll・pitch）を抑える。
    # Gazebo の床は水平で真の z・roll・pitch は一定。x, y は LiDAR の高さ 1.14 m のレバーアームで
    # roll・pitch と結合しているので、小さくしすぎると NDT の位置の揺れが roll・pitch に回る
    # Q: [1.0e-2, 1.0e-2, 1.0e-3, 2.0e-3, 2.0e-3, 1.0e-3, 0.05, 1.0]
