# 実機（WHILL、車椅子 blue）の環境設定。ros2 launch localization_bringup localization.launch.py env:=blue
# red.yaml（既定）とは、車椅子（nodes.whill_odometry.topics.motor_speed の Drp5_whill_<色>）・取付（static_tfs）・オドメトリの倍率（odom_scale）が違う。
# 実機に共通の設定を変えるときは red・blue・white の 3 つとも直す
#
# 環境を追加するときは、このファイルをコピーして param/env/<名前>.yaml を作り colcon build する
# （ビルドせずに試すなら env:=/path/to/<名前>.yaml）。
# このファイルは launch が読む（ROS のパラメータファイルではない）。

use_sim_time: false

# 起動するノード（enable）と、各ノードが購読・配信するトピック（topics。ノードの中の名前: 実際の名前）。
# launch は topics をそのまま remap に渡すので、つなぐときは配信側と購読側を同じ名前にする。/tf・/tf_static・/clock は変えない。
# 止めたノードの出力は、録画や別の PC から来るものとして扱う（つなぎ方は変わらない）。
# launch 引数 use_ekf:=（ekf_localizer と odom_relay）・rviz:= を付けると、enable よりそちらが優先
nodes:
  # WHILL の左右輪の速度からオドメトリを計算する
  whill_odometry:
    enable: true
    topics:
      motor_speed: /Drp5_whill_blue/whill_node/motor_speed_ts   # 購読：WHILL の左右輪の速度（ラズパイのホスト名 Drp5_whill_blue）
      /wheelchair/odom: /wheelchair/odom        # 配信：オドメトリ（この PC の時刻）
  # 車輪の角速度（JointState）からのオドメトリ（Gazebo で試す用。gazebo.yaml を参照）
  joint_state_odometry:
    enable: false
  # NDT
  pcl_localization:
    enable: true
    topics:
      velodyne_points: /velodyne_points         # 購読：点群（LiDAR の PC（ラズパイ）が配信。この PC と時刻同期している）
      initialpose: /initialpose                 # 購読：初期姿勢（LiDAR の姿勢。RViz の 2D Pose Estimate）
      map: /map                                 # 購読：地図（use_pcd_map: false のとき。今は PCD を読むので使わない）
      imu: /imu                                 # 購読：IMU（use_imu: true のとき。今は使わない）
      ndt_pose: /ndt_pose                       # 配信：NDT の解（map → LiDAR、stamp は点群の取得時刻）
      pcl_pose: /current_pose                   # 配信：NDT の解（RViz 用）
      # path: /path                             # 配信：NDT の解の軌跡（2026-11-11 に配信をやめた。NDT のソースでコメントアウトしている）
      initial_map: /initial_map                 # 配信：読み込んだ地図
      localization_debug: /localization_debug   # 配信：[点数, align 時間, 収束, fitness, angle_diff]
  # オドメトリに倍率を掛け、時刻を決めて EKF に渡す（観測ノイズ R は ekf_localizer が計算する）
  odom_relay:
    enable: true
    topics:
      odom: /wheelchair/odom                    # 購読：オドメトリ（whill_odometry）
      odom_out: /localization/odom              # 配信：倍率を掛け、時刻を決めたオドメトリ
  # EKF
  ekf_localizer:
    enable: true
    topics:
      ndt_pose: /ndt_pose                       # 購読：NDT の解
      odom: /localization/odom                  # 購読：オドメトリ（odom_relay）
      initialpose: /initialpose                 # 購読：初期姿勢（EKF をリセットする）
      ekf_pose: /ekf_pose                       # 配信：推定（map → LiDAR）
      ekf_odom: /ekf_odom                       # 配信：推定（map → base と速度）
  # RViz（ノードの中の名前は pcl_localization_ros2 の rviz/localization2.rviz に書いてある名前）
  rviz:
    enable: true
    topics:
      /velodyne_points: /velodyne_points        # 表示：点群
      /current_pose: /current_pose              # 表示：NDT の解
      /initial_map: /initial_map                # 表示：地図
      /initialpose: /initialpose                # 配信：2D Pose Estimate
      /goal_pose: /goal_pose                    # 配信：2D Goal Pose（使っていない）
      /clicked_point: /clicked_point            # 配信：Publish Point（使っていない）

base_frame_id: base_link          # EKF の状態・TF（map -> base_frame_id）の基準
lidar_frame_id: velodyne          # 点群のフレーム

# EKF の計算に使う、点群とオドメトリの時刻の決め方（点群は NDT、オドメトリは odom_relay が、同じ名前のパラメータ stamp_mode で行う。両方そろえる。点群のトピック自体の stamp は変えない）
#   stamp  : stamp をそのまま使う（時刻同期済み。今の実機はこれ）
#   receipt: この PC で受信した時刻にする（時計が同期していない環境用）
#   auto   : |受信した時刻 − stamp| が stamp_auto_threshold（既定 0.1 s。環境ファイルの最上位に書くと変えられる）以上なら受信した時刻、小さければ stamp
stamp_mode: stamp

# launch が配信する静的 TF [m], [rad]。URDF（robot_state_publisher）などが配信するものは書かない
static_tfs:
  # - {parent: base_link, child: velodyne, xyz: [-0.17, 0.0, 1.2], rpy: [0.0, 0.0, -0.017]}
  # - {parent: base_link, child: imu_link, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
  - {parent: base_link, child: velodyne, xyz: [-0.195, 0.0, 1.2], rpy: [-0.0138, 0.0167, 0.0191]}
  - {parent: base_link, child: imu_link, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}


# ノードごとのパラメータの上書き（共通値は pcl_localization_ros2/param/localization.yaml、
# ekf_localizer/param/ekf.yaml）。地図は launch 引数 map_path でも指定できる
parameters:
  pcl_localization:
    # 初期姿勢（LiDAR の姿勢）。地図の原点（z は LiDAR の高さ）。違う場所から始めるときは RViz の 2D Pose Estimate で与える
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 1.2
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0
  # TF・ekf_pose は ekf.yaml の predict_rate（50 Hz）の周期で、現在時刻まで予測した値（2026-10-26 に publish_trigger をやめた）
  ekf_localizer:
    # TF を周期（predict_rate 50 Hz）の刻みの stamp で、今より後の 2 刻みと今以前の 1 刻みを毎周期送る（送り直した刻みは
    # 購読側で置き換わる）。NDT・MATLAB は点群が届いた時点でその stamp の TF を持っている（2026-10-27、dev_log.md の 72）
    tf_future_steps: 2
    tf_past_steps: 1
    # 並びは [x, y, z, roll, pitch, yaw, v_xy, v_z, omega_roll, omega_pitch, omega_yaw]。
    # omega_roll・omega_pitch は 0.1（実機は傾きが動く。blue の録画で点群の時刻の予測値 − NDT の解の roll・pitch が最も小さい。
    # 調整に使っていない blue_spin5 で roll −9 %・pitch −5 %）。v_z は 0（大きくすると z が悪くなった）。Gazebo は 0（2026-11-07、dev_log.md の 76）
    # この Q・P_init・R_ndt は、2026-11-09 から ekf.yaml の既定と同じ値（既定を blue の値にした。dev_log.md の 82）
    Q: [5.0e-2, 5.0e-2, 5.0e-3, 5.0e-2, 5.0e-2, 5.0e-2, 0.05, 0.0, 0.1, 0.1, 10.0]
    P_init: [2.0e-1, 2.0e-1, 2.0e-1, 0.01, 0.01, 0.01, 0.01, 0.0, 0.01, 0.01, 0.01]
    R_ndt: [0.000208, 0.000155, 9.61e-05, 5.89e-05, 6.32e-05, 1.23e-05]
  # ---- オドメトリ（odom_relay：ekf_localizer に渡す前に、倍率を掛けて時刻を決める）----
  #   観測ノイズ R は ekf_localizer が計算する（ekf.yaml の R_odom・odom_noise_alpha・accel_noise_tau。全環境で同じ。2026-11-09）。
  #   時刻は stamp_mode（launch が NDT と odom_relay の stamp_mode・stamp_auto_threshold に入れる）、遅れの補正は ekf_localizer の odom_delay
  odom_relay:
    odom_scale: [1.014, 1.0141]                   # v・omega に掛ける倍率（blue の値）
