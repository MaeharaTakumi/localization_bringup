# 実機（WHILL、車椅子 blue）の環境設定。ros2 launch localization_bringup localization.launch.py env:=blue
# red.yaml（既定）と車椅子（nodes.whill_odometry.topics.motor_speed の Drp5_whill_<色>）だけが違う。実機の設定を変えるときは red・blue・white の 3 つとも直す
#
# 環境を追加するときは、このファイルをコピーして param/env/<名前>.yaml を作り colcon build する
# （ビルドせずに試すなら env:=/path/to/<名前>.yaml）。
# このファイルは launch が読む（ROS のパラメータファイルではない）。

use_sim_time: false

# 起動するノード（enable）と、各ノードが購読・配信するトピック（topics。ノードの中の名前: 実際の名前）。
# launch は topics をそのまま remap に渡すので、つなぐときは配信側と購読側を同じ名前にする。/tf・/tf_static・/clock は変えない。
# 止めたノードの出力は、録画や別の PC から来るものとして扱う（つなぎ方は変わらない）。
# launch 引数 use_ekf:=（ekf_localizer と odom_covariance）・rviz:= を付けると、enable よりそちらが優先
nodes:
  # WHILL の左右輪の速度からオドメトリを計算する
  whill_odometry:
    enable: true
    topics:
      motor_speed: /Drp5_whill_blue/whill_node/motor_speed_ts   # 購読：WHILL の左右輪の速度（ラズパイのホスト名 Drp5_whill_blue）
      /wheelchair/odom: /wheelchair/odom        # 配信：オドメトリ（この PC の時刻）
      /wheelchair/accel: /wheelchair/accel      # 配信：加速度
  # 車輪の角速度（JointState）からのオドメトリ（Gazebo で試す用。gazebo.yaml を参照）
  joint_state_odometry:
    enable: false
  # 点群の stamp を直す。stamp_mode が receipt・auto のときだけ起動する（enable は書かない）。
  # 起動するときは、ほかのノードで input と同じ名前のトピック（点群）を output に付け替える
  cloud_stamp_corrector:
    topics:
      input: /velodyne_points                   # 購読：点群
      output: /localization/points              # 配信：stamp を直した点群
  # NDT
  pcl_localization:
    enable: true
    topics:
      velodyne_points: /velodyne_points         # 購読：点群（LiDAR の PC（ラズパイ）が配信。この PC と時刻同期している）
      initialpose: /initialpose                 # 購読：初期姿勢（LiDAR の姿勢。RViz の 2D Pose Estimate）
      map: /map                                 # 購読：地図（use_pcd_map: false のとき。今は PCD を読むので使わない）
      imu: /imu                                 # 購読：IMU（use_imu: true のとき。今は使わない）
      ndt_pose: /ndt_pose                       # 配信：NDT の解（map → LiDAR、stamp は点群の取得時刻）
      pcl_pose: /current_pose                   # 配信：NDT の解（RViz 用）
      path: /path                               # 配信：NDT の解の軌跡
      initial_map: /initial_map                 # 配信：読み込んだ地図
      localization_debug: /localization_debug   # 配信：[点数, align 時間, 収束, fitness, angle_diff]
      tf_rviz: /tf_rviz                         # 配信：publish_rviz_tf: true のとき（launch は false にする）
  # オドメトリに倍率・観測ノイズ R・時刻を付けて EKF に渡す
  odom_covariance:
    enable: true
    topics:
      odom: /wheelchair/odom                    # 購読：オドメトリ（whill_odometry）
      odom_out: /localization/odom              # 配信：倍率・R・時刻を付けたオドメトリ
  # EKF
  ekf_localizer:
    enable: true
    topics:
      ndt_pose: /ndt_pose                       # 購読：NDT の解
      odom: /localization/odom                  # 購読：オドメトリ（odom_covariance）
      velodyne_points: /velodyne_points         # 購読：点群（publish_trigger: cloud のとき。stamp だけ使う）
      initialpose: /initialpose                 # 購読：初期姿勢（EKF をリセットする）
      ekf_pose: /ekf_pose                       # 配信：推定（map → LiDAR）
      ekf_odom: /ekf_odom                       # 配信：推定（map → base と速度）
      tf_ndt_update: /tf_ndt_update             # 配信：NDT で更新した直後の map → base（launch が RViz の /tf をこれにする）
  # RViz（ノードの中の名前は pcl_localization_ros2 の rviz/localization2.rviz に書いてある名前）
  rviz:
    enable: true
    topics:
      /velodyne_points: /velodyne_points        # 表示：点群
      /current_pose: /current_pose              # 表示：NDT の解
      /initial_map: /initial_map                # 表示：地図
      /ekf/pose: /ekf/pose                      # 表示：EKFPose（配信するノードは無い）
      /initialpose: /initialpose                # 配信：2D Pose Estimate
      /goal_pose: /goal_pose                    # 配信：2D Goal Pose（使っていない）
      /clicked_point: /clicked_point            # 配信：Publish Point（使っていない）

base_frame_id: base_link          # EKF の状態・TF（map -> base_frame_id）の基準
lidar_frame_id: velodyne          # 点群のフレーム

# 点群とオドメトリの時刻の決め方（点群は cloud_stamp_corrector、オドメトリは odom_covariance が行う。両方そろえる）
#   stamp  : stamp をそのまま使う（時刻同期済み。今の実機はこれ）
#   receipt: この PC で受信した時刻にする（時計が同期していない環境用）
#   auto   : |受信した時刻 − stamp| が clock_offset_threshold（既定 0.1 s）以上なら受信した時刻、小さければ stamp
stamp_mode: stamp

# launch が配信する静的 TF [m], [rad]。URDF（robot_state_publisher）などが配信するものは書かない
static_tfs:
  # - {parent: base_link, child: velodyne, xyz: [-0.17, 0.0, 1.2], rpy: [0.0, 0.0, -0.017]}
  # - {parent: base_link, child: imu_link, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
  - {parent: base_link, child: velodyne, xyz: [-0.195, 0.0, 1.2], rpy: [-0.0138, 0.0167, 0.0191]}
  - {parent: base_link, child: imu_link, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}


# ノードごとのパラメータの上書き（共通値は pcl_localization_ros2/param/localization.yaml、
# ekf_localizer/param/ekf.yaml）。地図は launch 引数 map_path でも指定できる
parameters:
  pcl_localization: 
    # map_path: /root/ros2_ws/map/SC10_4_0.05.pcd
    # # 初期姿勢（LiDAR の姿勢）。Gazebo の出現位置 /wheelchair/pose（base_footprint）
    # # (80.037, 7.072, 12.332), yaw 3.110 rad に取付 base_footprint -> velodyne を合成した値
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 1.2
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0
  # 点群の stamp の時刻で TF・ekf_pose を出すなら {publish_trigger: cloud}（既定は predict_rate の周期）
  ekf_localizer: 
    publish_trigger: cloud
    Q: [5.0e-2, 5.0e-2, 5.0e-3, 5.0e-2, 5.0e-2, 5.0e-2, 0.05, 10.0]
    R_ndt: [0.000208, 0.000155, 9.61e-05, 5.89e-05, 6.32e-05, 1.23e-05]
  cloud_stamp_corrector: {}
  # ---- オドメトリ（odom_covariance：ekf_localizer に渡す前に、倍率と観測ノイズ R を付ける）----
  #   R_v     = R_odom[0] + odom_noise_alpha[0]·v² + odom_noise_alpha[1]·ω² + (accel_noise_tau[0]·dv/dt)²
  #   R_omega = R_odom[1] + odom_noise_alpha[2]·v² + odom_noise_alpha[3]·ω² + (accel_noise_tau[1]·dω/dt)²
  #   ekf_localizer は odom_covariance_source: message でこの R を使う（ekf.yaml の R_odom ではない）。
  #   時刻は stamp_mode（launch が odom_covariance の stamp_mode・auto_threshold に入れる）、遅れの補正は ekf_localizer の odom_delay
  odom_covariance:
    R_odom: [6.08e-3, 9.92e-4]                 # 止まっているときの分散 [v, omega]
    odom_noise_alpha: [0.0, 0.0, 0.0, 0.0]   # 速さに応じた分 [v²→R_v, ω²→R_v, v²→R_omega, ω²→R_omega]（試したが効かなかった）
    R_odom_other: 1.0e-6                     # 他の成分（vy, vz, vroll, vpitch）の分散
    accel_noise_tau: [0.0, 0.0]              # 加速度に応じた分 [τ_v, τ_omega] [s]：R に (τ·加速度)²（試したが効かなかった）
    odom_scale: [1.014, 1.0141]                   # v・omega に掛ける倍率（実機は未校正）
