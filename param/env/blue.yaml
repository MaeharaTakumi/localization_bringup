# 実機（WHILL、車椅子 blue）の環境設定。ros2 launch localization_bringup localization.launch.py env:=blue
# red.yaml（既定）と車椅子（topics.motor_speed の Drp5_whill_<色>）だけが違う。実機の設定を変えるときは red・blue・white の 3 つとも直す
#
# 環境を追加するときは、このファイルをコピーして param/env/<名前>.yaml を作り colcon build する
# （ビルドせずに試すなら env:=/path/to/<名前>.yaml）。
# このファイルは launch が読む（ROS のパラメータファイルではない）。

use_sim_time: false

topics:
  points: /velodyne_points        # 点群（LiDAR の PC（ラズパイ）が配信。この PC と時刻同期している）
  odom: /wheelchair/odom          # オドメトリ（whill_odometry が配信。この PC の時刻）
  motor_speed: /Drp5_whill_blue/whill_node/motor_speed_ts   # whill_odometry の入力（WHILL の左右輪の速度。ラズパイのホスト名 Drp5_whill_blue）

# whill_odometry を起動するか。起動するときは topics.motor_speed を受け取り、topics.odom に配信する
launch_odometry: true

base_frame_id: base_link          # EKF の状態・TF（map -> base_frame_id）の基準
lidar_frame_id: velodyne          # 点群のフレーム

# 点群とオドメトリの時刻の決め方（点群は cloud_stamp_corrector、オドメトリは odom_covariance が行う。両方そろえる）
#   true  : stamp をそのまま使う（時刻同期済み。今の実機はこれ）
#   false : この PC で受信した時刻にする（時計が同期していない環境用）
#   auto  : |受信した時刻 − stamp| が clock_offset_threshold（既定 0.1 s）以上なら受信した時刻、小さければ stamp
clock_synced: true

# launch が配信する静的 TF [m], [rad]。URDF（robot_state_publisher）などが配信するものは書かない
static_tfs:
  # - {parent: base_link, child: velodyne, xyz: [-0.17, 0.0, 1.2], rpy: [0.0, 0.0, -0.017]}
  # - {parent: base_link, child: imu_link, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
  - {parent: base_link, child: velodyne, xyz: [-0.195, 0.0, 1.2], rpy: [-0.0138, 0.0167, 0.0191]}
  - {parent: base_link, child: imu_link, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}


# ノードごとのパラメータの上書き（共通値は pcl_localization_ros2/param/localization.yaml、
# ekf_localizer/param/ekf.yaml）。地図は launch 引数 map_path でも指定できる
parameters:
  pcl_localization: 
    # map_path: /root/ros2_ws/map/SC10_4_0.05.pcd
    # # 初期姿勢（LiDAR の姿勢）。Gazebo の出現位置 /wheelchair/pose（base_footprint）
    # # (80.037, 7.072, 12.332), yaw 3.110 rad に取付 base_footprint -> velodyne を合成した値
    set_initial_pose: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 1.2
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0
  # 点群の stamp の時刻で TF・ekf_pose を出すなら {publish_trigger: cloud}（既定は predict_rate の周期）
  ekf_localizer: 
    publish_trigger: cloud
    Q: [5.0e-2, 5.0e-2, 5.0e-3, 5.0e-2, 5.0e-2, 5.0e-2, 0.05, 10.0]
    R_ndt: [0.000208, 0.000155, 9.61e-05, 5.89e-05, 6.32e-05, 1.23e-05]
  cloud_stamp_corrector: {}
  # ---- オドメトリ（odom_covariance：ekf_localizer に渡す前に、倍率と観測ノイズ R を付ける）----
  #   R_v     = R_odom[0] + odom_noise_alpha[0]·v² + odom_noise_alpha[1]·ω² + (accel_noise_tau[0]·dv/dt)²
  #   R_omega = R_odom[1] + odom_noise_alpha[2]·v² + odom_noise_alpha[3]·ω² + (accel_noise_tau[1]·dω/dt)²
  #   ekf_localizer は odom_covariance_source: message でこの R を使う（ekf.yaml の R_odom ではない）。
  #   時刻は clock_synced（launch が stamp_mode・auto_threshold を入れる）、遅れの補正は ekf_localizer の odom_delay
  odom_covariance:
    R_odom: [6.08e-3, 9.92e-4]                 # 止まっているときの分散 [v, omega]
    odom_noise_alpha: [0.0, 0.0, 0.0, 0.0]   # 速さに応じた分 [v²→R_v, ω²→R_v, v²→R_omega, ω²→R_omega]（試したが効かなかった）
    R_odom_other: 1.0e-6                     # 他の成分（vy, vz, vroll, vpitch）の分散
    accel_noise_tau: [0.0, 0.0]              # 加速度に応じた分 [τ_v, τ_omega] [s]：R に (τ·加速度)²（試したが効かなかった）
    odom_scale: [1.014, 1.0141]                   # v・omega に掛ける倍率（実機は未校正）
