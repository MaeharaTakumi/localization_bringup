# localization_bringup の環境 white（ros2 launch localization_bringup localization.launch.py env:=white）
# このフォルダの <ノード名>.yaml を launch がそのノードに渡す。yaml が無いノード、yaml に書いていない項目は、
# そのノードのコードの既定値になる（どの項目も書いておく。2026-11-11、dev_log.md の 84）。
# 実機（WHILL、車椅子 white）。red とは車椅子（whill_odometry.yaml の input_topic_name）だけが違う。blue は取付（static_tfs）・倍率（ekf_localizer.yaml の odom_scale）も違う。
# 実機に共通の設定を変えるときは red・blue・white の 3 つとも直す
#
# env.yaml は launch が読む（ROS のパラメータファイルではない）。書いていない項目は、use_sim_time: false、static_tfs: なし、
# nodes: pcl_localization と ekf_localizer だけ true（env を指定しないときと同じ）。

use_sim_time: false

# 起動するノード。launch 引数 use_ekf:=（ekf_localizer）・rviz:= を付けるとそちらが優先
# トピックは各ノードの名前のまま（/velodyne_points・/ndt_pose・/wheelchair/odom・/initialpose・/ekf_pose・/ekf_odom・/initial_map）で
# つながる。launch が付け替えるのは ekf_localizer の odom（→ /wheelchair/odom）と NDT の pcl_pose（→ /current_pose）だけ
nodes:
  whill_odometry: true    # WHILL の左右輪の速度からオドメトリ /wheelchair/odom を計算する（実機だけ）
  pcl_localization: true    # NDT
  ekf_localizer: true       # EKF
  rviz: true                # RViz（pcl_localization_ros2 の rviz/localization2.rviz）

# launch が配信する静的 TF [m], [rad]。URDF（robot_state_publisher）などが配信するものは書かない。
# 親は ekf_localizer.yaml・pcl_localization.yaml の base_frame_id、子は lidar_frame_id と同じ名前にする
static_tfs:
  - {parent: base_link, child: velodyne, xyz: [-0.17, 0.0, 1.2], rpy: [0.0, 0.0, 0.017]}
  - {parent: base_link, child: imu_link, xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
